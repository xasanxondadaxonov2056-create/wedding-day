<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikoh To'yi Taklifnomasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        .card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            padding: 40px 25px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header-title {
            font-family: 'Alex Brush', cursive;
            font-size: 3.2rem;
            color: #d4af37;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(212,175,55,0.3);
        }
        .guest-title {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 20px 0;
        }
        .details-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .time-highlight {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f59e0b;
            margin-bottom: 5px;
        }
        .text-desc {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .btn-map {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #000;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
        }
        .btn-map:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="guest-title">Muhtaram Mehmonimiz</div>
        <div class="header-title">Taklifnoma</div>
        <div class="divider"></div>
        <p class="text-desc">Sizni quvonchli kunimizda yozilajak to'y dasturxonimizga taklif etamiz!</p>
        
        <div class="details-box">
            <div class="time-highlight">Soat 08:00 da</div>
            <p class="text-desc">To'y oshimizga marhamat qiling!</p>
        </div>

        <div class="details-box">
            <p class="text-desc"><strong>Manzil:</strong> Xonqiz shaharchasi</p>
            <a href="https://maps.google.com/?q=40.2878711,71.4938441" target="_blank" class="btn-map">📍 Lokatsiyani xaritada ochish</a>
        </div>
    </div>
</body>
</html>
